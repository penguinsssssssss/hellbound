# Paste into https://api.slack.com/apps -> Create New App -> From a manifest.
# Bot scopes only: the bot posts as itself and reads nothing.
display_information:
  name: Hellbound
  description: Is going to hell on a regular basis. Abandon hope all ye who enter.
  background_color: "#8b0000"
features:
  bot_user:
    display_name: Hellbound
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write          # chat.postMessage
      - chat:write.public   # post in public channels without being invited
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
